# Alternative flags for building against a libvpx that wants the dynamic CRT.
#
# Use with:  cargo build --config .cargo/dynamic-crt.toml --features vpx
#
# A file passed with --config is merged over .cargo/config.toml, so this
# replaces that file's rustflags for the Windows target and nothing else.
#
# Why this exists as a file rather than an instruction to edit the real config:
# the flags have to be restated in full, and the one that must never be lost is
# target-cpu=x86-64. Editing the tracked config invites forgetting to restore it;
# doing the same through RUSTFLAGS is worse still, because that variable replaces
# the config's flags wholesale and target-cpu would disappear silently. Here it
# is written out, in the file, where its absence would be visible.
#
# What this costs: the binary is no longer self-contained and needs the Visual
# C++ Redistributable on whatever machine runs it. On a neglected old machine —
# which is exactly the profile of the target Celeron — that package may be
# missing, and the binary then fails to start with no window and no log entry.
# Install the redistributable there before relying on a build made this way.
#
# The prebuilt libvpx from ShiftMediaProject is built against the dynamic CRT
# (its libvpx.lib carries 235 DEFAULTLIB:"MSVCRT" directives), so a static-CRT
# build against it ends at LNK2038: mismatch detected for RuntimeLibrary.
# Building libvpx through vcpkg with the x64-windows-static triplet avoids all
# of this and keeps the binary self-contained — prefer it where the network
# allows.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64"]
