# Pin the generic x86-64 baseline for the Windows target.
#
# This flag is not negotiable. The whole question phase 0 asks is "does a
# Celeron N3150 (Braswell: SSE4.2, no AVX) keep up?". A harness compiled for the
# build machine's CPU answers a different question — and on the target it does
# not answer any question at all, because it dies with STATUS_ILLEGAL_INSTRUCTION
# (0xc000001d) before the first frame, exactly as the predecessor did.
#
# NEVER set target-cpu to native, haswell, or x86-64-v3 here.
#
# ---------------------------------------------------------------------------
# On the missing +crt-static
#
# It used to be here, and it is what the client product ships with, because a
# statically linked C runtime means one self-contained file and no dependency on
# the Visual C++ Redistributable — which a neglected old machine often lacks,
# and whose absence is a silent non-start: no window, no log entry.
#
# It is absent because the prebuilt libvpx this harness links against is built
# against the *dynamic* runtime (235 DEFAULTLIB:"MSVCRT" directives in its
# libvpx.lib). Mixing the two ends in LNK2038, or — as it did here — in
# unresolved __imp_round, __imp__beginthreadex and __imp_fopen: libvpx asking
# for imports while our side supplies static symbols.
#
# So the measurement binary needs the Visual C++ Redistributable on whatever
# machine runs it. Install it on the target Celeron before the trip; discovering
# it there costs the trip.
#
# Building libvpx through vcpkg with the x64-windows-static triplet avoids all
# of this. That path keeps the static runtime and the self-contained binary, and
# is the right one for the product — use `--config .cargo/static-crt.toml`
# with it. It is not the default here only because the network that has to run
# this cannot reach vcpkg's mirrors.
# ---------------------------------------------------------------------------
# On /IGNORE:4099
#
# The prebuilt libvpx.lib carries references to a libvpx.pdb that the archive
# does not ship, so the linker emits LNK4099 once per object file — around two
# hundred lines of "linking object as if no debug info". Harmless: nobody steps
# through libvpx here, and the code linked is identical either way.
#
# It is silenced because that wall of text buries the linker warnings that do
# matter. LNK4098 — a C runtime mismatch — is exactly the class of message this
# project has already been bitten by, and it looks just like the noise. One
# warning number is suppressed by name; everything else still shows.
#
# NOT VERIFIED on a Windows machine: some versions of link.exe list LNK4099
# among the warnings that /IGNORE refuses to suppress. If it still appears,
# leave it — the flag costs nothing when it does nothing. The certain fix is
# debug = 0 in [profile.release], because then no PDB is produced at all and
# the warning has nothing to complain about; the price is a panic without a
# file and line, which this harness has needed more than once.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64", "-C", "link-arg=/IGNORE:4099"]
