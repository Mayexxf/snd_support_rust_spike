[package]
name = "spike-encode"
description = "Colour conversion and VP8/VP9 encoding for the phase-0 harness. The conversion is platform-independent and under test on any host; libvpx is behind the `vpx` feature so the capture harness still builds where it is absent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
spike-capture.workspace = true

# Off by default on purpose. libvpx needs vcpkg, nasm and LLVM on the build
# machine, and none of that should stand between someone and a capture
# measurement. Enable with --features vpx.
[dependencies.env-libvpx-sys]
version = "5.1"
features = ["generate"]
optional = true

[features]
vpx = ["dep:env-libvpx-sys"]
