[package]
name = "spike-encode"
description = "Colour conversion and VP8/VP9 encoding for the phase-0 harness. The conversion is platform-independent and under test on any host; libvpx is behind the `vpx` feature so the capture harness still builds where it is absent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
spike-capture.workspace = true

[features]
# Off by default on purpose: capture is measurable without an encoder, and
# nothing about libvpx should stand between someone and a capture measurement.
#
# No dependency here. The declarations are written out in src/vpx/ffi.rs and the
# build script points the linker at the library, so enabling this needs a
# libvpx.lib and nothing else — no vcpkg, no bindgen, no LLVM.
vpx = []
