[package]
name = "spike-run"
description = "Phase-0 measurement runner: captures for a fixed time and prints what the machine managed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "spike"
path = "src/main.rs"

[dependencies]
spike-metrics.workspace = true
spike-capture.workspace = true

# timeBeginPeriod only. Windows' default timer granularity is 15.6 ms, which
# quantises every wait and silently caps the poll rate — see `timer` in main.rs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media"] }
