[package]
name = "spike-capture"
description = "Frame sources for the phase-0 harness: DXGI Desktop Duplication, a GDI fallback, and a synthetic desktop that runs anywhere."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

# Platform dependencies are target-gated so the workspace still builds and tests
# on macOS, which is where the harness itself is developed. Same arrangement as
# sanador-winapi in the client repository, and for the same reason.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
